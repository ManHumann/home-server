services:
    
    frontend:
        build:
            context: ./frontend
        ports:
            - "80:80"

    backend:
        build:
            context: ./backend
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - postgres
        volumes:
            - /home/admin/home-media-data/uploads:/server/uploads

    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - /home/admin/home-media-data/postgres:/var/lib/postgresql/data
            - /home/admin/projects/home-media-server/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
