name: Build Docker Image

on:
    push:
        branches:
            - actions

jobs:
    build:
        runs-on: ubuntu-latest


        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
              username: ${{secrets.DOCKER_USERNAME }}
              password: ${{secrets.DOCKER_TOKEN }}            

        - name: Build Backend Image
          run: |
              docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/home-media-backend:latest \
              ./backend
        - name : Push Bakend Image
          run: |
              docker push \
              ${{ secrets.DOCKER_USERNAME }}/home-media-backend:latest
        
        - name: Build Postgres Image
          run: |
              docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/home-media-postgres:latest \
              ./database
        - name : Push Postgres Image
          run: |
              docker push \
              ${{ secrets.DOCKER_USERNAME }}/home-media-postgres:latest

        - name: Build Frontend Image
          run: |
              docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/home-media-frontend:latest \
              ./frontend

        - name : Push Frontend Image
          run: |
              docker push \
              ${{ secrets.DOCKER_USERNAME }}/home-media-frontend:latest
